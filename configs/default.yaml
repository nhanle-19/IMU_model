seed: 42

data:
  synthetic: false
  root: ./data
  split_dirs:
    train: train
    val: val
    test: test
  file_glob: "*.npz"
  imu_key: imu
  velocity_key: vel_body
  imu_columns:
  velocity_columns:
  input_channels: 6
  # One actual prediction window: 1 second from the 200 Hz source, fed at 100 Hz.
  imu_freq: 200.0
  sample_freq: 100
  window_size: 200
  stride: 200
  target_at: mean
  sequence_cache_size: 4
  train_synthetic_size: 128
  val_synthetic_size: 32

model:
  velocity_dim: 3
  hidden_dim: 128
  time_dim: 64

diffusion:
  steps: 200
  beta_start: 0.001
  beta_end: 0.05

policy:
  num_candidates: 64
  # Cap the expanded diffusion sampling batch (batch_size * candidate chunk)
  # used during validation, policy training, and inference.
  candidate_sample_batch_size: 8192
  hidden_dim: 128
  candidate_dim: 64
  residual_penalty_weight: 0.01
  attention_entropy_weight: 0.0
  # Optional bootstrap mode for early experiments. Keep false for deployment-
  # matching training where every policy candidate comes from diffusion.
  bootstrap_with_target_candidate: false
  target_candidate_std: 0.05

train:
  out_dir: ./runs/velocity_diffusion
  # Fallback used when the stage-specific knobs below are unset.
  batch_size: 1024
  # Stage-specific batch sizes are per process/device. With torchrun refiner
  # DDP, each rank uses refiner_batch_size_per_gpu.
  diffusion_batch_size_per_gpu: 256
  refiner_batch_size_per_gpu: 512
  epochs: 100
  learning_rate: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  num_workers: 4
  drop_last: false
  val_every_n_epochs: 5
  val_max_batches: 0

inference:
  batch_size: 256
