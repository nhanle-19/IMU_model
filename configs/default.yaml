seed: 42

data:
  synthetic: false
  root: ./data
  split_dirs:
    train: train
    val: val
    test: test
  file_glob: "*.npz"
  imu_key: imu
  velocity_key: vel_body
  imu_columns:
  velocity_columns:
  input_channels: 6
  # One actual prediction window: 1 second from the 200 Hz source, fed at 100 Hz.
  imu_freq: 200.0
  sample_freq: 100
  window_size: 200
  stride: 200
  target_at: mean
  train_synthetic_size: 128
  val_synthetic_size: 32

model:
  velocity_dim: 3
  hidden_dim: 128
  time_dim: 64

diffusion:
  steps: 10
  beta_start: 0.0001
  beta_end: 0.02

policy:
  num_candidates: 32
  hidden_dim: 128
  candidate_dim: 64
  residual_penalty_weight: 0.01
  attention_entropy_weight: 0.0
  # Optional bootstrap mode for early experiments. Keep false for deployment-
  # matching training where every policy candidate comes from diffusion.
  bootstrap_with_target_candidate: false
  target_candidate_std: 0.05

train:
  out_dir: ./runs/velocity_diffusion
  batch_size: 32
  epochs: 2
  learning_rate: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  num_workers: 0
  drop_last: false

inference:
  batch_size: 256
