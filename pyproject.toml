[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imu_velocity_diffusion"
version = "0.1.0"
description = "Diffusion-assisted IMU base velocity candidate generation and selection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = []
keywords = ["imu", "diffusion", "velocity-estimation", "robotics", "deep-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "pyyaml>=6.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
# Development / linting / tests.
dev = ["ruff>=0.1", "pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["imu_velocity_diffusion*"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "config",
    "doc",
    "example",
    "starter",
    "tartan_imu",
    "tools",
    "main_net.py",
    "test.py",
    "train.py",
    "tests/conftest.py",
    "tests/unit",
]

[tool.pytest.ini_options]
testpaths = ["tests/test_diffusion_stack.py"]
