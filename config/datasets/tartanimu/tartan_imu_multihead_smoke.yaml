

port: 11572
seeds:
  use_seeds: True
  id: 42

# ============================================================================
# DATA CONFIGURATION -- 4-way multi-head (car/drone/dog/human) on tartanimu_data
# Smoke variant of tartan_imu_dataset.yaml: few epochs, single-GPU, train+test.
# ============================================================================
data:
  dataset: AirLab
  data_path:
      car: ../dataset/tartanimu_data/car/2
      dog: ../dataset/tartanimu_data/dog/1+eth
      human: ../dataset/tartanimu_data/human/1

  use_local_coord: True
  train_dir: train
  test_dir: test
  validation_dir: val

  random_partition: False
  data_rate: 1.0
  train_rate: 0.7
  test_rate: 0.15
  valid_rate: 0.15

  imu_freq: 200.0
  sample_freq: 40
  low_pass_filter:
    enabled: True
    kernel_size: 5

  gravity_alignment:
    enabled: False
    magnitude: 9.8101
    direction: [0, 0, -1]
    enable_validation: False
    visualize: False

augment:
  feat_acc_sigma: 0.0001
  feat_gyr_sigma: 0.00001
  add_bias_noise: True
  accel_bias_range: 0.1
  gyro_bias_range: 0.002
  add_gravity_noise: True
  gravity_noise_theta_range: 5

model:
  model_name: Foundation_Model
  model_yaml: './config/resnet_lstm_multihead.yaml'
  pred_velocity: True
  adapter: False

train:
  out_dir: ../exp_result/tartan_imu_multihead_smoke
  use_pretrain_model: False
  use_multi_gpu: False             # single-GPU for a simple smoke run
  use_amp: True
  batch_size: 128
  epochs: 3                        # smoke: just verify end-to-end + all 4 heads learn
  start_cov_epochs: 200            # keep covariance OFF for the smoke (epochs < this)
  n_workers: 4
  seq_len: 10
  predict_start: 0
  predict_end: 10
  add_noise: True
  active_heads: ["car","dog","human"]

  optimizer:
    learning_rate: 0.0001
    method: Adam
    weight_decay: 0.01

  scheduler:
    factor: 0.1
    patience: 8

val:
  batch_size: 128
  n_workers: 2

test:
  out_dir: ../exp_result/tartan_imu_multihead_smoke
  n_workers: 2

schemes:
  train: True
  test:  True
  online_adaption: False
