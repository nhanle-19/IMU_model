model_param:
  input_dim: 6
  output_dim: 3
  split_z: True
  past_time: 0.0
  window_time: 1.0
  future_time: 0.0
  layer_sizes: [ 2, 2, 2, 2 ]
  drop_ratio: 0.3  # Reduced dropout for better multi-head performance
  lstm_size: 128   # Increased for better representation learning
  lstm_layers: 2   # Increased layers for better temporal modeling
  lstm_dropout: 0.1  # Added dropout for regularization
  use_transformer: False
  platform_conditioning:
    enabled: True
    classifier_sample_freq: 200
    condition_mode: latent   # latent or index
    latent_dim: 16
    num_platforms: 4
    loss_weight: 0.2
    route_by_prediction: True
